<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Magical Spell Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px;
      }

      #spellArea {
        width: 300px;
        height: 100px;
        margin: 20px auto;
        border: 2px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
      }

      button {
        padding: 10px 20px;
        margin: 10px;
        cursor: pointer;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to the Magical Spell Generator!</h1>

    <div id="spellArea">Your spell will appear here...</div>

    <button id="generateButton">Generate Spell</button>
    <button id="resetButton">Reset</button>

    <ul id="ingredientsList">
      <li>Dragon Scale</li>
      <li>Phoenix Feather</li>
      <li>Unicorn Horn</li>
    </ul>

    <script src="week8_ex01_dom_spell_generator.js"></script>
  </body>
</html>
